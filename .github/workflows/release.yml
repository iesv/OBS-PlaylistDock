name: OBS-PlaylistDock
on:
  push:
    tags: ['1.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Prepare SDK
        run: python scripts/prepare-ci.py
      - name: Install test tools
        run: python -m pip install imageio-ffmpeg==0.6.0 ninja
      - name: Build and test
        run: python scripts/run-ci.py
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-2022
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: macos-15
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^project\(OBS-PlaylistDock VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          test "$GITHUB_REF_NAME" = "$version"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" dist/*.zip --clobber
          else
            gh release create "$version" dist/*.zip --title "$version" --notes INIT
          fi
